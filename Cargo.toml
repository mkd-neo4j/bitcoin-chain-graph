[package]
name = "bitcoin-chain-graph"
version = "0.1.0"
edition = "2021"
authors = ["Michael Down <michael@downuk.com>"]
license = "Apache-2.0"
repository = "https://github.com/mkd-neo4j/bitcoin-chain-graph"
homepage = "https://github.com/mkd-neo4j/bitcoin-chain-graph"
documentation = "https://github.com/mkd-neo4j/bitcoin-chain-graph"
description = "High-performance Bitcoin blockchain ingestion into Neo4j for forensic analysis"
readme = "README.md"
keywords = ["bitcoin", "blockchain", "neo4j", "graph", "forensics"]
categories = ["database", "cryptography::cryptocurrencies"]

[dependencies]
bitcoin = "0.31"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
hex = "0.4"
async-trait = "0.1"
chrono = "0.4"

[dev-dependencies]
hex = "0.4"
